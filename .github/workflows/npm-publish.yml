name: Publish package to npm (trusted publisher)

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to publish (tag or branch). Default: current ref"
        required: false
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      PUBLISH_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || (github.event_name == 'release' && github.event.release.tag_name || github.ref_name) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PUBLISH_REF }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Validate release tag matches package version
        if: github.event_name == 'release'
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          echo "Tag: $TAG"
          echo "package.json version: $PKG_VERSION"
          if [[ "$TAG" != "$PKG_VERSION" ]]; then
            echo "Release tag version does not match package.json version" >&2
            exit 1
          fi

      - name: Package dry-run check
        run: npm run pack:check

      - name: Publish to npm
        run: npm publish --provenance --access public
